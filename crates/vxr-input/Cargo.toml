[package]
name = "vxr-input"
version = "0.1.0"
edition = "2021"
authors = ["Project VXR Team"]
description = "6DoF Pose predictor, controller mapping, and ViGEmBus gamepad emulation for Project VXR"

[dependencies]
vxr-protocol = { path = "../vxr-protocol" }
vigem-client = { version = "0.1.4", features = ["unstable_ds4"] }
thiserror = "2.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
env_logger = "0.11"
