[package]
name = "vxr-audio"
version = "0.1.0"
edition = "2021"
authors = ["Project VXR Team"]
description = "Low-latency WASAPI Loopback capture, 5ms Opus compression, and Audio Clock Drift Compensation"

[dependencies]
vxr-protocol = { path = "../vxr-protocol" }
audiopus = { version = "0.2.0", features = ["encoder", "decoder"] }
byteorder = "1.5"
thiserror = "2.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
]

[dev-dependencies]
env_logger = "0.11"
