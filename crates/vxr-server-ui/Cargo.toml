[package]
name = "vxr-server-ui"
version = "0.1.0"
edition = "2021"
authors = ["Project VXR Team"]
description = "Tauri v2 GUI Management Dashboard & Web Control Panel for Project VXR"

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "2.0"
vxr-protocol = { path = "../vxr-protocol" }
vxr-discovery = { path = "../vxr-discovery" }
vxr-pacer = { path = "../vxr-pacer" }
vxr-audio = { path = "../vxr-audio" }
vxr-input = { path = "../vxr-input" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
env_logger = "0.11"
