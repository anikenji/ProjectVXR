[package]
name = "vxr-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Project VXR Team"]
description = "Core network wire protocol, FEC, and UDP socket management for Project VXR"

[dependencies]
byteorder = "1.5"
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
reed-solomon-erasure = "6.0"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2.0"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
