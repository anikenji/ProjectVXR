apply plugin: 'com.android.application'

android {
    namespace 'com.projectvxr.client'
    compileSdk 34
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "com.projectvxr.client"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-29"
                cppFlags "-std=c++17 -Wall -Wextra"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
}
